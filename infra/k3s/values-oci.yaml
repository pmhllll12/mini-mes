# Oracle Cloud K3s 서버용 values - 차트 기본값(k3d 로컬 이미지) 위에 덮어쓴다
# 이미지는 CI가 main 푸시 때 GHCR에 올린 amd64/arm64 멀티아키텍처 이미지
image:
  repository: ghcr.io/pmhllll12/mini-mes-api
  tag: latest
  pullPolicy: Always

anomalyWorker:
  image:
    repository: ghcr.io/pmhllll12/mini-mes-anomaly-worker
    tag: latest
    pullPolicy: Always

# 자연어 질의 - 방문자용. 평가(13/13)를 통과한 gemini-2.5-flash. 무료 등급 하루 20회는 평가 실행과 공유
# 질문 1건에 보통 2회(도구 1회 + 답변) 호출 → 방문자는 하루 8건으로 제한해 평가용 여유를 남긴다
# provider·allowedProviders를 gemini로 고정 - 요청 본문의 provider로 다른 제공자(Claude 등)를 쓰지 못하게
nlq:
  provider: gemini
  geminiModel: gemini-2.5-flash
  allowedProviders: gemini
  dailyLimit: 8
# Grafana 관리자 비밀번호는 deploy.sh가 GRAFANA_ADMIN_PASSWORD로 넘긴다 (여기 두지 않음)

# 외부 공개 - https://mes.pmhllll12.cloud (DNS A 레코드 → VM 공인 IP, 보안 목록 80/443)
# basic-auth Secret은 deploy.sh가 ADMIN_PASSWORD로 만든다
ingress:
  enabled: true
  host: mes.pmhllll12.cloud
  clusterIssuer: letsencrypt-prod
