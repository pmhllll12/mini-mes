name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mini_mes
          POSTGRES_USER: mes_user
          POSTGRES_PASSWORD: mes_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mes_user -d mini_mes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mes_user:mes_password@localhost:5432/mini_mes

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: Load DB schema
        run: PGPASSWORD=mes_password psql -h localhost -U mes_user -d mini_mes -f db/schema.sql

      - name: Lint (ruff)
        run: ruff check .
        working-directory: api

      - name: Run tests
        run: pytest -v
        working-directory: api

  anomaly-worker-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r anomaly-worker/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check anomaly-worker evaluate

      - name: Unit tests (feature extraction, scoring, model cache)
        run: pytest -v
        working-directory: anomaly-worker

      - name: Unit tests (evaluation metrics)
        run: pytest -v
        working-directory: evaluate

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Helm은 차트 밖 파일을 읽지 못해 복사본을 두므로, 원본과 어긋나면 실패시킨다
      - name: Check chart file copies are in sync
        run: |
          diff -u db/schema.sql charts/mini-mes/files/schema.sql
          diff -u monitoring/grafana/dashboards/mini-mes.json charts/mini-mes/files/grafana-dashboard.json
          diff -u monitoring/grafana/provisioning/alerting/alerting.yml charts/mini-mes/files/grafana-alerting.yml

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Helm lint and render
        run: |
          helm lint charts/mini-mes
          helm template mini-mes charts/mini-mes > /dev/null
          helm template mini-mes charts/mini-mes --set monitoring.enabled=false --set anomalyWorker.enabled=false > /dev/null
          helm template mini-mes charts/mini-mes --set monitoring.prometheus.persistence.enabled=false > /dev/null

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4

      # 자격 증명 없이 문법·구성만 검사 (plan/apply는 로컬에서)
      - name: Terraform fmt and validate
        working-directory: infra/terraform/oci
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  docker-build:
    runs-on: ubuntu-24.04
    needs: [test, anomaly-worker-test, chart]
    # main 푸시 때만 GHCR에 올린다 (PR은 빌드만 확인). 서버(Oracle Cloud A1)가 ARM이라 amd64·arm64 둘 다 빌드
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, anomaly-worker]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mini-mes-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main) ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
