services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mini_mes
      POSTGRES_USER: mes_user
      POSTGRES_PASSWORD: mes_password
    ports:
      - "5432:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_user -d mini_mes"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://mes_user:mes_password@db:5432/mini_mes
      # 자연어 질의(/query) - 값은 프로젝트 루트의 .env에서 읽는다 (.env.example 참고, .env는 커밋하지 않음)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NLQ_PROVIDER: ${NLQ_PROVIDER:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # OpenAI 호환 API (로컬 Ollama 예: http://host.docker.internal:11434/v1, 모델 qwen2.5:7b-instruct). 키는 선택
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      NLQ_TIMEOUT_SEC: ${NLQ_TIMEOUT_SEC:-60}
      # 공개 서버용 남용 방지 - 하루 질문 상한(0이면 없음), 허용 제공자(쉼표 구분, 비우면 전부)
      NLQ_DAILY_LIMIT: ${NLQ_DAILY_LIMIT:-0}
      NLQ_ALLOWED_PROVIDERS: ${NLQ_ALLOWED_PROVIDERS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트(WSL)에서 도는 Ollama 접속용
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # 가상 설비 데이터를 계속 보내는 시뮬레이터 - 필요할 때만: docker compose --profile sim up -d simulator
  # 이상탐지 학습 데이터(정상만)를 만들 때는 먼저 멈춘다 (docker compose stop simulator)
  # api 이미지(requests 포함)에 simulator/를 마운트해 실행 - 별도 이미지 없음
  simulator:
    image: mini-mes-api
    profiles: ["sim"]
    volumes:
      - ./simulator:/sim:ro
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python", "/sim/simulate.py", "--api-url", "http://api:8000", "--interval", "5", "--anomaly-rate", "0.05", "--drift-rate", "0.01"]
    restart: unless-stopped
    depends_on:
      - api

  anomaly-worker:
    build:
      context: ./anomaly-worker
    environment:
      DATABASE_URL: postgresql://mes_user:mes_password@db:5432/mini_mes
      MODEL_DIR: /models
      INTERVAL_SEC: "10"
    volumes:
      - anomaly_models:/models
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - api
      - anomaly-worker

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 알림 수신처 (monitoring/grafana/provisioning/alerting). URL이 비어 있으면 Grafana가 시작하지 못하므로
      # .env에 없을 때는 연결되지 않는 예약 도메인(.invalid)을 넣는다 - 규칙은 평가·표시되고 발송만 실패
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-http://discord-webhook-not-set.invalid}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  mes_pgdata:
  anomaly_models:
