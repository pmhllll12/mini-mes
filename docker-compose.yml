services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mini_mes
      POSTGRES_USER: mes_user
      POSTGRES_PASSWORD: mes_password
    ports:
      - "5432:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_user -d mini_mes"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://mes_user:mes_password@db:5432/mini_mes
      # 자연어 질의(/query) - 값은 프로젝트 루트의 .env에서 읽는다 (.env.example 참고, .env는 커밋하지 않음)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NLQ_PROVIDER: ${NLQ_PROVIDER:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  anomaly-worker:
    build:
      context: ./anomaly-worker
    environment:
      DATABASE_URL: postgresql://mes_user:mes_password@db:5432/mini_mes
      MODEL_DIR: /models
      INTERVAL_SEC: "10"
    volumes:
      - anomaly_models:/models
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
      - anomaly-worker

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 알림 수신처 (monitoring/grafana/provisioning/alerting). URL이 비어 있으면 Grafana가 시작하지 못하므로
      # .env에 없을 때는 연결되지 않는 예약 도메인(.invalid)을 넣는다 - 규칙은 평가·표시되고 발송만 실패
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-http://discord-webhook-not-set.invalid}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mes_pgdata:
  anomaly_models:
