image:
  repository: mini-mes-api
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  port: 8000
  service:
    type: ClusterIP
    port: 8001

# 자연어 질의(POST /query) - API 키는 values에 넣지 않고 Secret으로만 받는다 (values는 git에 커밋되므로)
#   kubectl create secret generic <release>-llm --from-env-file=.env
# Secret이나 키가 없으면 /query만 503이고 api는 정상 동작 (secretKeyRef optional)
nlq:
  existingSecret: ""   # 비우면 "<release>-llm". 키 이름은 ANTHROPIC_API_KEY, GEMINI_API_KEY
  provider: ""         # claude | gemini, 비우면 키가 있는 제공자(claude 우선)
  claudeModel: ""      # 비우면 claude-opus-5
  geminiModel: ""      # 비우면 gemini-flash-latest

db:
  image: postgres:16
  port: 5432
  storage: 1Gi
  user: mes_user
  password: mes_password
  database: mini_mes

# 이상탐지 워커 - 모델은 PVC(/models)에 저장. 학습은 README "Helm" 절 참고 (kubectl exec ... python train.py)
anomalyWorker:
  enabled: true
  image:
    repository: mini-mes-anomaly-worker
    tag: latest
    pullPolicy: IfNotPresent
  intervalSec: 10
  lookbackHours: 24
  metricsPort: 9100
  modelStorage: 100Mi

# 예약 리포트 - 매일 전날(KST) 설비별 OEE·불량·이상·열화 경보 요약을 daily_report에 저장 (GET /reports/daily로 조회)
report:
  enabled: true
  schedule: "10 0 * * *"   # 00:10 - 자정 직전 데이터가 들어올 여유
  timeZone: Asia/Seoul
  image: curlimages/curl:8.22.0

# 모니터링 - Prometheus(api·워커 스크레이프) + Grafana(대시보드 프로비저닝). docker-compose의 monitoring/ 구성과 동일
# files/grafana-dashboard.json은 monitoring/grafana/dashboards/mini-mes.json의 복사본 (CI에서 동기화 검사)
monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.55.1
    port: 9090
    scrapeInterval: 10s
    retention: 15d
    # 메트릭 저장소. enabled면 PVC라 파드를 다시 만들어도 이력(열화 경보 이력 포함)이 유지되고, false면 emptyDir
    persistence:
      enabled: true
      size: 1Gi
  grafana:
    image: grafana/grafana:11.3.0
    port: 3000
    adminUser: admin
    adminPassword: admin   # 로컬 검증용 기본값. 실제 배포 시 --set monitoring.grafana.adminPassword=... 로 변경
    # 알림(Discord) - 웹훅 URL은 values에 넣지 않고 Secret으로만:
    #   kubectl create secret generic <release>-alerting --from-literal=DISCORD_WEBHOOK_URL=...
    # Secret이 없으면 규칙은 평가·표시되고 발송만 실패
    alerting:
      existingSecret: ""   # 비우면 "<release>-alerting"
