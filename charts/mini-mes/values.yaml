image:
  repository: mini-mes-api
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  port: 8000
  service:
    type: ClusterIP
    port: 8001

db:
  image: postgres:16
  port: 5432
  storage: 1Gi
  user: mes_user
  password: mes_password
  database: mini_mes

# 이상탐지 워커 - 모델은 PVC(/models)에 저장. 학습은 README "Helm" 절 참고 (kubectl exec ... python train.py)
anomalyWorker:
  enabled: true
  image:
    repository: mini-mes-anomaly-worker
    tag: latest
    pullPolicy: IfNotPresent
  intervalSec: 10
  lookbackHours: 24
  metricsPort: 9100
  modelStorage: 100Mi
