image:
  repository: mini-mes-api
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  port: 8000
  service:
    type: ClusterIP
    port: 8001

db:
  image: postgres:16
  port: 5432
  storage: 1Gi
  user: mes_user
  password: mes_password
  database: mini_mes

# 이상탐지 워커 - 모델은 PVC(/models)에 저장. 학습은 README "Helm" 절 참고 (kubectl exec ... python train.py)
anomalyWorker:
  enabled: true
  image:
    repository: mini-mes-anomaly-worker
    tag: latest
    pullPolicy: IfNotPresent
  intervalSec: 10
  lookbackHours: 24
  metricsPort: 9100
  modelStorage: 100Mi

# 모니터링 - Prometheus(api·워커 스크레이프) + Grafana(대시보드 프로비저닝). docker-compose의 monitoring/ 구성과 동일
# files/grafana-dashboard.json은 monitoring/grafana/dashboards/mini-mes.json의 복사본 (CI에서 동기화 검사)
monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.55.1
    port: 9090
    scrapeInterval: 10s
    retention: 15d   # 저장소는 emptyDir - 파드를 지우면 메트릭 이력도 사라짐 (로컬 검증용)
  grafana:
    image: grafana/grafana:11.3.0
    port: 3000
    adminUser: admin
    adminPassword: admin   # 로컬 검증용 기본값. 실제 배포 시 --set monitoring.grafana.adminPassword=... 로 변경
