{{- if .Values.monitoring.enabled }}
{{- $fullname := include "mini-mes.fullname" . }}
{{- $graf := .Values.monitoring.grafana }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: {{ $graf.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ $graf.adminPassword | quote }}
  # 알림 수신처 기본값: 연결되지 않는 예약 도메인 (URL이 비면 Grafana가 시작하지 못함).
  # 실제 URL은 뒤에 붙는 <release>-alerting Secret이 덮어쓴다 (envFrom은 뒤의 값이 우선)
  DISCORD_WEBHOOK_URL: "http://discord-webhook-not-set.invalid"
---
# docker-compose의 monitoring/grafana/provisioning 과 같은 구성 (datasource URL만 클러스터 Service 이름)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-provisioning
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: mini-mes-prometheus
        type: prometheus
        access: proxy
        url: http://{{ $fullname }}-prometheus:{{ .Values.monitoring.prometheus.port }}
        isDefault: true
        editable: true
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: "mini-mes"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-dashboards
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
data:
  mini-mes.json: |
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
---
# 알림 규칙·Discord 수신처 (monitoring/grafana/provisioning/alerting/alerting.yml 복사본)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-alerting
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
data:
  alerting.yml: |
{{ .Files.Get "files/grafana-alerting.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mini-mes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "mini-mes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ print (.Files.Get "files/grafana-dashboard.json") (.Files.Get "files/grafana-alerting.yml") (toJson .Values.monitoring) | sha256sum | trunc 16 }}  # 대시보드·설정이 바뀌면 파드 재시작
    spec:
      containers:
        - name: grafana
          image: {{ $graf.image }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-grafana
            # DISCORD_WEBHOOK_URL - 없으면 위 기본값(발송만 실패)
            - secretRef:
                name: {{ $graf.alerting.existingSecret | default (printf "%s-alerting" .Release.Name) }}
                optional: true
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            {{- if .Values.ingress.enabled }}
            # Ingress의 /grafana 경로에서 제공 (API와 같은 호스트)
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ .Values.ingress.host }}/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $graf.port }}
          readinessProbe:
            httpGet:
              path: {{ if .Values.ingress.enabled }}/grafana{{ end }}/api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ if .Values.ingress.enabled }}/grafana{{ end }}/api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
      volumes:
        - name: provisioning
          configMap:
            name: {{ $fullname }}-grafana-provisioning
        - name: dashboards
          configMap:
            name: {{ $fullname }}-grafana-dashboards
        - name: alerting
          configMap:
            name: {{ $fullname }}-grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mini-mes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: {{ $graf.port }}
      targetPort: http
{{- end }}
