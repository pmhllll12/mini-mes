{{- if .Values.monitoring.enabled }}
{{- $fullname := include "mini-mes.fullname" . }}
{{- $graf := .Values.monitoring.grafana }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: {{ $graf.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ $graf.adminPassword | quote }}
---
# docker-compose의 monitoring/grafana/provisioning 과 같은 구성 (datasource URL만 클러스터 Service 이름)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-provisioning
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: mini-mes-prometheus
        type: prometheus
        access: proxy
        url: http://{{ $fullname }}-prometheus:{{ .Values.monitoring.prometheus.port }}
        isDefault: true
        editable: true
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: "mini-mes"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-dashboards
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
data:
  mini-mes.json: |
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mini-mes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "mini-mes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ print (.Files.Get "files/grafana-dashboard.json") (toJson .Values.monitoring) | sha256sum | trunc 16 }}  # 대시보드·설정이 바뀌면 파드 재시작
    spec:
      containers:
        - name: grafana
          image: {{ $graf.image }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-grafana
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          ports:
            - name: http
              containerPort: {{ $graf.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: {{ $fullname }}-grafana-provisioning
        - name: dashboards
          configMap:
            name: {{ $fullname }}-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mini-mes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: {{ $graf.port }}
      targetPort: http
{{- end }}
