apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini-mes.fullname" . }}-api
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "mini-mes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "mini-mes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # api는 시작할 때 DB에 연결(create_all 등)하므로, DB가 연결을 받을 때까지 기다린다
      # (docker-compose의 depends_on: condition: service_healthy 에 해당)
      initContainers:
        - name: wait-for-db
          image: {{ .Values.db.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "mini-mes.fullname" . }}-db -p {{ .Values.db.port }} -U {{ .Values.db.user }} -d {{ .Values.db.database }}; do
                echo "DB 대기 중..."; sleep 2
              done
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mini-mes.fullname" . }}-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
