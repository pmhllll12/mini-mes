{{- if .Values.machiningData.enabled }}
{{- /*
정밀가공 품질 데이터(KAMP) 적재 - api 이미지의 load_machining_quality.py를 쓴다
- CSV는 라이선스상 저장소·이미지에 넣지 않고 ConfigMap으로 따로 올린다 (values.yaml machiningData 참고).
  ConfigMap이 없으면 적재를 건너뛰고 성공으로 끝낸다 (optional)
- 훅 Job: 설치·업그레이드 때 테이블이 비어 있을 때만 적재 (--if-empty, 배포할 때마다 재생이 처음으로 돌아가지 않게)
- CronJob: 주기마다 다시 적재 - replay면 received_at을 지금부터 다시 펼친다 (재생 방식 A, 조회는 received_at <= 지금만)
*/}}
{{- $configMap := .Values.machiningData.existingConfigMap | default (printf "%s-machining-data" (include "mini-mes.fullname" .)) }}
{{- $replayArg := ternary "--replay-start now" "" .Values.machiningData.replay }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mini-mes.fullname" . }}-machining-load-init
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
    app.kubernetes.io/component: machining-load
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "mini-mes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: machining-load
    spec:
      {{- include "mini-mes.machiningLoadPod" (dict "root" . "configMap" $configMap "args" (printf "--if-empty %s" $replayArg | trim)) | nindent 6 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mini-mes.fullname" . }}-machining-replay
  labels:
    {{- include "mini-mes.labels" . | nindent 4 }}
    app.kubernetes.io/component: machining-load
spec:
  schedule: {{ .Values.machiningData.schedule | quote }}
  timeZone: {{ .Values.machiningData.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "mini-mes.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: machining-load
        spec:
          {{- include "mini-mes.machiningLoadPod" (dict "root" . "configMap" $configMap "args" $replayArg) | nindent 10 }}
{{- end }}
